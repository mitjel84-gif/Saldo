<!DOCTYPE html>
<html lang="nl">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="theme-color" content="#f5f7fb">
  <meta name="description" content="Saldo is jouw persoonlijke geldbespaar-dashboard. Houd uitgaven, abonnementen, budgetten en spaardoelen overzichtelijk bij.">
  <title>Saldo — Meer grip op je geld</title>
  <style>
    :root { --bg:#f5f7fb; --surface:#fff; --text:#192039; --muted:#8490a4; --line:#e9ecf3; --purple:#6857df; --purple-dark:#5141bb; --purple-soft:#f0edff; --green:#0ba87c; --green-soft:#e8faf3; --orange:#ea9b39; --orange-soft:#fff4e8; --red:#e25f69; --red-soft:#fff0f1; --shadow:0 7px 30px rgba(25,32,57,.035); --radius:21px; }
    * { box-sizing:border-box; }
    html { scroll-behavior:smooth; }
    body { margin:0; background:var(--bg); color:var(--text); font-family:Inter,ui-sans-serif,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif; -webkit-font-smoothing:antialiased; }
    button,input,select { font:inherit; }
    button { cursor:pointer; }
    button:focus-visible, input:focus-visible, select:focus-visible, a:focus-visible { outline:3px solid #aaa0fa; outline-offset:2px; }
    .ico { height:20px; width:20px; display:inline-block; fill:none; stroke:currentColor; stroke-width:1.9; stroke-linecap:round; stroke-linejoin:round; flex-shrink:0; }
    .app { display:flex; min-height:100vh; }
    .sidebar { width:251px; flex:0 0 251px; background:#fff; border-right:1px solid var(--line); min-height:100vh; display:flex; flex-direction:column; padding:29px 16px 19px; position:sticky; top:0; height:100vh; z-index:30; }
    .brand { display:flex; align-items:center; gap:11px; text-decoration:none; color:var(--text); padding:0 10px 34px; }
    .brand-logo { display:grid; place-items:center; background:var(--purple); color:#fff; height:39px; width:39px; border-radius:13px; box-shadow:0 7px 14px #6857df32; }
    .brand-logo .ico { width:25px; height:25px; }
    .brand-name { font-size:26px; font-weight:850; letter-spacing:-1.4px; line-height:1; }
    .brand-name span { color:var(--purple); }
    .side-label { font-size:10px; letter-spacing:1.6px; text-transform:uppercase; font-weight:850; color:#a1a9ba; margin:10px 12px 12px; }
    .nav-list { display:grid; gap:5px; }
    .nav-link { display:flex; align-items:center; width:100%; gap:12px; border:0; background:none; padding:12px 15px; border-radius:12px; font-size:13.5px; font-weight:660; color:#778196; text-align:left; transition:background .2s,color .2s; }
    .nav-link .ico { height:19px; width:19px; }
    .nav-link:hover { color:var(--purple); background:#f7f5ff; }
    .nav-link.active { color:var(--purple); background:var(--purple-soft); font-weight:750; }
    .nav-link.active:before { content:''; position:absolute; left:0; width:3px; height:23px; border-radius:0 5px 5px 0; background:var(--purple); }
    .side-spacer { flex:1; }
    .side-help { background:#f5f2ff; border-radius:18px; padding:19px 15px; margin:22px 3px 18px; }
    .side-help .bubble { width:35px; height:35px; display:grid; place-items:center; color:var(--purple); background:#e9e2ff; border-radius:10px; margin-bottom:11px; }
    .side-help b { font-size:13px; }
    .side-help p { color:#8b88a7; font-size:11.5px; line-height:1.6; margin:6px 0 0; }
    .side-footer { color:#a3aabb; font-size:10px; padding:0 12px; line-height:1.5; }
    .main { width:calc(100% - 251px); min-width:0; }
    .topbar { height:88px; padding:0 42px; background:rgba(255,255,255,.86); border-bottom:1px solid var(--line); display:flex; align-items:center; justify-content:space-between; gap:15px; }
    .topbar-left { display:flex; align-items:center; gap:13px; }
    .topbar h1 { font-size:20px; line-height:1.15; letter-spacing:-.6px; margin:0 0 5px; font-weight:800; }
    .topbar p { margin:0; color:var(--muted); font-size:12px; }
    .top-actions { display:flex; align-items:center; gap:14px; }
    .today { color:#8a94a7; font-size:12px; white-space:nowrap; font-weight:600; }
    .pill { display:inline-flex; align-items:center; gap:6px; color:var(--purple); background:var(--purple-soft); border:1px solid #e8e2ff; padding:6px 10px; border-radius:20px; font-size:10px; font-weight:800; white-space:nowrap; }
    .btn { display:inline-flex; align-items:center; justify-content:center; gap:8px; padding:11px 17px; border:1px solid transparent; border-radius:11px; font-weight:760; font-size:12px; line-height:1.2; text-decoration:none; transition:transform .2s,background .2s,border-color .2s; white-space:nowrap; }
    .btn:hover { transform:translateY(-1px); }
    .btn .ico { width:17px; height:17px; }
    .btn-primary { background:var(--purple); color:white; box-shadow:0 5px 16px #6857df27; }
    .btn-primary:hover { background:var(--purple-dark); }
    .btn-white { color:#3f3477; background:#fff; }
    .btn-light { background:#f3f3fc; color:var(--purple); }
    .btn-outline { color:var(--text); background:#fff; border:1px solid var(--line); }
    .btn-danger { color:#bf3d51; background:#fff0f2; }
    .menu-btn { display:none; border:0; background:none; color:var(--text); padding:7px; }
    .container { max-width:1520px; margin:0 auto; padding:30px 42px 55px; }
    .eyebrow { color:var(--purple); font-size:10px; letter-spacing:1.65px; text-transform:uppercase; font-weight:850; }
    .hero { background:radial-gradient(ellipse at 82% 10%,#8076ec 0,transparent 48%),linear-gradient(105deg,#292252,#5447cc 80%,#776add); color:white; border-radius:24px; min-height:230px; position:relative; overflow:hidden; padding:31px 36px; display:flex; justify-content:space-between; align-items:center; box-shadow:0 14px 35px #4c40b31a; }
    .hero:before { content:''; position:absolute; width:270px; height:270px; border:1px solid #ffffff25; border-radius:50%; right:42px; top:-135px; }
    .hero:after { content:''; position:absolute; width:350px; height:350px; border:1px solid #ffffff24; border-radius:50%; right:-165px; bottom:-215px; }
    .hero-content { position:relative; z-index:2; max-width:520px; }
    .hero .overline { color:#ddd9ff; font-size:10px; text-transform:uppercase; font-weight:790; letter-spacing:2px; }
    .hero h2 { font-size:27px; font-weight:840; letter-spacing:-1px; line-height:1.2; margin:13px 0 9px; }
    .hero p { color:#dfddfa; font-size:12.5px; line-height:1.7; margin:0 0 18px; }
    .hero-art { position:relative; height:180px; width:230px; flex:0 0 230px; margin-right:30px; }
    .art-ring { position:absolute; height:175px; width:175px; border:22px solid #ffffff1a; right:0; top:0; border-radius:50%; }
    .art-card { position:absolute; background:white; border-radius:16px; padding:17px; box-shadow:0 12px 30px #090c2538; transform:rotate(-9deg); right:35px; top:32px; width:177px; }
    .art-card .art-dot { height:34px; width:34px; background:#e5faf1; color:#1baf82; border-radius:11px; display:grid; place-items:center; }
    .art-card small { font-size:9px; display:block; color:#8d93a6; margin:16px 0 4px; }
    .art-card strong { font-size:23px; color:#262448; letter-spacing:-.9px; }
    .art-chip { position:absolute; right:-9px; bottom:6px; z-index:2; padding:10px 13px; background:#d5ffea; color:#0d916b; border-radius:12px; font-size:11px; font-weight:800; transform:rotate(7deg); box-shadow:0 8px 20px #130e4830; }
    .stats-grid { display:grid; grid-template-columns:repeat(4,minmax(0,1fr)); gap:17px; margin:22px 0; }
    .stat { background:var(--surface); border:1px solid var(--line); box-shadow:var(--shadow); border-radius:var(--radius); padding:19px 20px 17px; min-width:0; }
    .stat-top { display:flex; align-items:center; justify-content:space-between; gap:8px; }
    .stat-top span { color:#77849b; font-weight:650; font-size:11px; }
    .stat-icon { width:35px; height:35px; border-radius:10px; display:grid; place-items:center; }
    .stat-icon .ico { width:18px; height:18px; }
    .purple-icon { background:var(--purple-soft); color:var(--purple); }
    .green-icon { background:var(--green-soft); color:var(--green); }
    .orange-icon { background:var(--orange-soft); color:var(--orange); }
    .red-icon { background:var(--red-soft); color:var(--red); }
    .stat-value { font-size:clamp(20px,2.1vw,28px); font-weight:840; letter-spacing:-.9px; margin-top:10px; white-space:nowrap; overflow:hidden; text-overflow:ellipsis; }
    .stat-foot { color:#9ba5b6; font-size:10.5px; margin-top:7px; }
    .stat-foot span { color:var(--green); font-weight:700; }
    .two-col { display:grid; grid-template-columns:minmax(0,1.32fr) minmax(310px,1fr); gap:20px; margin-bottom:20px; }
    .card { background:var(--surface); border:1px solid var(--line); border-radius:var(--radius); box-shadow:var(--shadow); min-width:0; }
    .card-body { padding:23px 24px; }
    .card-heading { display:flex; align-items:flex-start; justify-content:space-between; gap:12px; margin-bottom:21px; }
    .card-title { margin:0; font-size:15px; font-weight:820; letter-spacing:-.3px; }
    .card-sub { margin:5px 0 0; font-size:11px; color:#9ba5b7; line-height:1.5; }
    .link-button { border:0; background:none; color:var(--purple); font-size:11px; font-weight:780; padding:3px 0; display:inline-flex; align-items:center; gap:5px; }
    .link-button .ico { width:14px; height:14px; }
    .pie-section { display:flex; align-items:center; gap:27px; flex-wrap:wrap; justify-content:space-around; padding:7px 0 8px; }
    .donut { width:188px; height:188px; border-radius:50%; position:relative; flex:0 0 188px; display:grid; place-items:center; }
    .donut:before { content:''; width:137px; height:137px; background:white; border-radius:50%; position:absolute; }
    .donut-inner { z-index:1; text-align:center; }
    .donut-inner span { display:block; font-size:10px; color:#97a1b4; margin-bottom:6px; }
    .donut-inner strong { display:block; font-size:21px; letter-spacing:-.8px; }
    .legend { flex:1; min-width:165px; max-width:280px; }
    .legend-row { display:flex; gap:10px; justify-content:space-between; align-items:center; padding:7px 0; font-size:11px; }
    .legend-label { display:flex; align-items:center; gap:9px; color:#7b8698; }
    .color-dot { width:9px; height:9px; border-radius:4px; display:inline-block; flex-shrink:0; }
    .legend-row strong { font-size:11px; font-weight:800; }
    .budget-list { display:grid; gap:16px; }
    .budget-top { display:flex; align-items:center; justify-content:space-between; gap:8px; margin-bottom:8px; }
    .budget-name { display:flex; align-items:center; gap:9px; font-weight:720; font-size:11.5px; }
    .budget-amount { color:#9ca5b4; font-size:10.5px; white-space:nowrap; }
    .budget-amount b { color:#323b51; }
    .progress { height:7px; width:100%; background:#eff1f7; border-radius:100px; overflow:hidden; }
    .progress > span { display:block; height:100%; min-width:0; border-radius:100px; transition:width .35s; }
    .budget-footer { display:flex; justify-content:space-between; margin-top:6px; color:#a2aaba; font-size:9.5px; }
    .transactions { display:grid; gap:0; }
    .tx-row { display:flex; align-items:center; padding:12px 0; border-bottom:1px solid #f1f2f7; gap:12px; }
    .tx-row:first-child { padding-top:0; }
    .tx-row:last-child { border-bottom:0; padding-bottom:0; }
    .tx-icon { display:grid; place-items:center; width:40px; height:40px; border-radius:12px; flex:0 0 40px; font-size:18px; }
    .tx-main { flex:1; min-width:0; }
    .tx-title { font-size:11.8px; font-weight:760; white-space:nowrap; text-overflow:ellipsis; overflow:hidden; }
    .tx-meta { font-size:10px; color:#9ca5b7; margin-top:5px; }
    .tx-end { text-align:right; margin-left:auto; }
    .tx-amount { white-space:nowrap; font-size:12px; font-weight:800; }
    .tx-amount.income { color:var(--green); }
    .tx-date { color:#a1aabd; font-size:10px; margin-top:5px; }
    .icon-button { border:0; color:#8f99ab; background:none; border-radius:9px; height:31px; width:31px; display:inline-grid; place-items:center; }
    .icon-button:hover { background:var(--purple-soft); color:var(--purple); }
    .icon-button .ico { width:16px; height:16px; }
    .action-pair { display:flex; flex-shrink:0; }
    .insight { border-radius:15px; background:#f3f0ff; display:flex; align-items:flex-start; gap:12px; padding:16px; margin-bottom:11px; }
    .insight:last-child { margin-bottom:0; }
    .insight .insight-ico { width:35px; height:35px; flex:0 0 35px; background:white; color:var(--purple); border-radius:11px; display:grid; place-items:center; }
    .insight h3 { font-size:12px; margin:0 0 5px; }
    .insight p { color:#827e9b; line-height:1.6; font-size:11px; margin:0; }
    .insight.green { background:#e9faf3; }
    .insight.green .insight-ico { color:var(--green); }
    .insight.green p { color:#668f81; }
    .bar-chart { display:flex; gap:13px; align-items:end; height:190px; padding-top:10px; }
    .bar-col { display:flex; flex:1; flex-direction:column; height:100%; min-width:0; align-items:center; justify-content:flex-end; gap:8px; }
    .bar-stack { width:100%; max-width:35px; height:153px; display:flex; flex-direction:column; justify-content:flex-end; }
    .bar { width:100%; min-height:3px; border-radius:7px 7px 3px 3px; background:#e8e4ff; }
    .bar.current { background:linear-gradient(180deg,#7c6aee,#6250d4); }
    .bar-col label { font-size:10px; color:#9ca6b7; text-align:center; }
    .bar-col.current label { color:var(--purple); font-weight:800; }
    .section-heading { display:flex; align-items:center; justify-content:space-between; gap:12px; margin:2px 0 19px; }
    .section-heading h2 { font-size:21px; font-weight:850; margin:0; letter-spacing:-.7px; }
    .section-heading p { color:var(--muted); font-size:12px; margin:6px 0 0; }
    .toolbar { display:flex; gap:11px; align-items:center; flex-wrap:wrap; margin-bottom:19px; }
    .search-box { display:flex; align-items:center; gap:9px; background:white; border:1px solid var(--line); padding:0 13px; border-radius:11px; height:43px; flex:1; min-width:190px; max-width:380px; color:#a6afbe; }
    .search-box input { border:0; background:none; outline:none; width:100%; height:100%; color:var(--text); font-size:12px; }
    .search-box .ico { width:18px; height:18px; }
    select,input[type="date"],input[type="number"],input[type="text"] { color:var(--text); }
    .select { border:1px solid var(--line); border-radius:11px; height:43px; padding:0 15px; background:white; font-size:12px; color:#67758b; max-width:100%; }
    .list-card { padding:0 22px; }
    .list-card .tx-row { padding:16px 0; }
    .list-card .tx-row:first-child { padding-top:16px; }
    .list-card .tx-row:last-child { padding-bottom:16px; }
    .sub-grid,.goal-grid,.budget-grid { display:grid; grid-template-columns:repeat(3,minmax(0,1fr)); gap:17px; }
    .sub-card { padding:19px; }
    .sub-top { display:flex; gap:12px; align-items:center; }
    .service-logo { flex:0 0 48px; height:48px; width:48px; border-radius:15px; background:#eeeaff; color:var(--purple); display:grid; place-items:center; font-weight:850; font-size:20px; }
    .sub-name { font-size:13px; font-weight:800; overflow-wrap:anywhere; }
    .sub-type { font-size:11px; color:#9ca6b9; margin-top:4px; }
    .sub-price { font-size:26px; font-weight:850; letter-spacing:-1px; margin:23px 0 3px; }
    .sub-price small { font-size:12px; color:#a0aabd; font-weight:550; letter-spacing:0; }
    .sub-bottom { border-top:1px solid var(--line); margin-top:15px; padding-top:13px; display:flex; align-items:center; justify-content:space-between; gap:7px; }
    .sub-date { color:#99a5b7; font-size:10px; }
    .status { display:inline-flex; gap:5px; align-items:center; font-size:10px; font-weight:800; background:var(--green-soft); color:var(--green); border-radius:30px; padding:5px 8px; }
    .status.inactive { color:#a0a3b2; background:#f0f1f5; }
    .muted-card { opacity:.67; }
    .goal-card { padding:22px; }
    .goal-top { display:flex; justify-content:space-between; align-items:center; }
    .goal-emoji { display:grid; place-items:center; font-size:24px; width:51px; height:51px; border-radius:14px; background:var(--purple-soft); }
    .goal-name { font-size:14px; font-weight:800; margin:19px 0 7px; }
    .goal-saved { font-size:21px; font-weight:860; letter-spacing:-.7px; }
    .goal-saved small { color:#9ca6b7; font-size:11px; font-weight:500; letter-spacing:0; }
    .goal-percent { display:flex; justify-content:space-between; font-size:10px; margin:13px 0 8px; color:#a0aabc; }
    .goal-percent strong { color:var(--purple); }
    .goal-actions { display:flex; gap:8px; margin-top:20px; }
    .goal-actions .btn { flex:1; padding:10px 7px; }
    .budget-card { padding:21px; }
    .budget-card-title { display:flex; gap:10px; align-items:center; justify-content:space-between; }
    .budget-card-icon { width:39px; height:39px; border-radius:12px; display:grid; place-items:center; font-size:20px; background:#f3f1ff; }
    .budget-card h3 { font-size:13px; margin:16px 0 16px; }
    .budget-card .amount-big { font-size:22px; font-weight:850; }
    .budget-card .amount-big span { font-size:11px; color:#a1adbb; font-weight:500; }
    .budget-card p { font-size:10px; color:#a2abb9; margin:8px 0 18px; }
    .empty { text-align:center; padding:44px 18px; color:#98a3b5; }
    .empty-icon { width:54px; height:54px; border-radius:17px; background:var(--purple-soft); color:var(--purple); display:grid; place-items:center; margin:0 auto 13px; }
    .empty h3 { font-size:15px; color:var(--text); margin:0 0 8px; }
    .empty p { font-size:12px; line-height:1.6; max-width:340px; margin:0 auto 16px; }
    .banner { border-radius:17px; display:flex; align-items:center; justify-content:space-between; gap:15px; padding:17px 22px; background:linear-gradient(105deg,#eeeaff,#e6faf2); border:1px solid #e9e5fe; margin:0 0 20px; }
    .banner h3 { font-size:13px; margin:0 0 5px; }
    .banner p { margin:0; color:#8385a6; font-size:11px; line-height:1.6; }
    .mini-topics { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:17px; }
    .mini-topic { padding:20px; }
    .mini-topic .eyebrow { display:block; margin:0 0 12px; }
    .mini-topic strong { font-size:23px; letter-spacing:-.8px; }
    .mini-topic p { font-size:11px; color:#98a4b6; line-height:1.6; }
    .settings-row { display:flex; align-items:center; justify-content:space-between; gap:15px; padding:17px 0; border-bottom:1px solid var(--line); }
    .settings-row:last-child { border:0; }
    .settings-row strong { font-size:12px; }
    .settings-row p { color:#9da7b9; font-size:11px; margin:5px 0 0; line-height:1.5; }
    .notice { font-size:11px; color:#8d96a8; line-height:1.7; margin-top:15px; }
    .modal-wrap { position:fixed; inset:0; background:rgba(23,27,47,.53); backdrop-filter:blur(4px); z-index:100; display:none; align-items:center; justify-content:center; padding:18px; overflow-y:auto; }
    .modal-wrap.open { display:flex; }
    .modal { background:white; border-radius:22px; box-shadow:0 22px 90px #0003; width:100%; max-width:480px; max-height:calc(100vh - 35px); overflow-y:auto; padding:24px; }
    .modal-heading { display:flex; align-items:center; justify-content:space-between; margin-bottom:19px; }
    .modal-heading h2 { font-size:18px; margin:0; letter-spacing:-.5px; }
    .field { display:block; margin-bottom:15px; }
    .field-label { display:block; margin-bottom:7px; font-size:11px; font-weight:750; color:#5b6580; }
    .field-control { border:1px solid #e2e6f0; height:44px; border-radius:10px; padding:0 13px; background:#fff; display:block; width:100%; font-size:13px; outline:none; }
    .field-control:focus { border-color:var(--purple); box-shadow:0 0 0 3px #6857df17; }
    .form-grid { display:grid; grid-template-columns:repeat(2,minmax(0,1fr)); gap:12px; }
    .form-actions { display:flex; justify-content:flex-end; gap:9px; margin-top:10px; }
    .form-hint { color:#9ca6b7; font-size:10px; margin:-8px 0 16px; line-height:1.5; }
    .toast { position:fixed; right:23px; bottom:24px; z-index:200; background:#252645; color:white; border-radius:12px; box-shadow:0 12px 34px #1f21484a; padding:14px 18px; font-size:12px; font-weight:650; transform:translateY(90px); opacity:0; pointer-events:none; transition:transform .25s,opacity .25s; max-width:min(360px,calc(100vw - 40px)); }
    .toast.show { transform:translateY(0); opacity:1; }
    .shade { display:none; }
    .mobile-nav { display:none; }
    .fineprint { text-align:center; color:#aab2c1; font-size:10px; margin-top:35px; line-height:1.6; }

<script>
(function(){
'use strict';
const KEY='saldo-dashboard-v1';
const categories=['Wonen','Boodschappen','Vervoer','Uit eten','Shoppen','Gezondheid','Overig'];
const catInfo={
 'Wonen':{icon:'🏡',color:'#8574ec',soft:'#f0edff'},
 'Boodschappen':{icon:'🛒',color:'#15ae90',soft:'#e5faf3'},
 'Vervoer':{icon:'🚗',color:'#e4a14b',soft:'#fff5e8'},
 'Uit eten':{icon:'🍽️',color:'#ee7c86',soft:'#fff0f2'},
 'Shoppen':{icon:'🛍️',color:'#79a1e6',soft:'#edf4ff'},
 'Gezondheid':{icon:'💊',color:'#a486ce',soft:'#f6eeff'},
 'Overig':{icon:'✨',color:'#9da9bc',soft:'#f0f3f7'},
 'Inkomsten':{icon:'💸',color:'#10aa83',soft:'#e3faf1'}
};
const chartColors=['#7867e6','#13b592','#edaa55','#ec7d91','#78a6e3','#a78bd6','#a8afc1'];
const icon=n=>`<svg class="ico" aria-hidden="true"><use href="#i-${n}"></use></svg>`;
const el=document.getElementById('view');
const monthNames=['januari','februari','maart','april','mei','juni','juli','augustus','september','oktober','november','december'];
const now=new Date();
const money=n=>new Intl.NumberFormat('nl-NL',{style:'currency',currency:'EUR',minimumFractionDigits:2,maximumFractionDigits:2}).format(Number(n)||0);
const safe=s=>String(s??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const inputDate=d=>`${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,'0')}-${String(d.getDate()).padStart(2,'0')}`;
const makeDate=(m,day)=>{const d=new Date(now.getFullYear(),now.getMonth()+m,1);d.setDate(Math.min(day,new Date(d.getFullYear(),d.getMonth()+1,0).getDate()));return inputDate(d);};
const displayDate=s=>{if(!/^\d{4}-\d{2}-\d{2}$/.test(String(s)))return '-';const [y,m,d]=s.split('-').map(Number);return `${d} ${monthNames[m-1]?.slice(0,3)||''} ${y}`;};
const startMonth=s=>typeof s==='string'&&s.slice(0,7)===`${now.getFullYear()}-${String(now.getMonth()+1).padStart(2,'0')}`;
const makeId=()=>window.crypto?.randomUUID?.() || `${Date.now()}-${Math.random().toString(36).slice(2)}`;
const sample=()=>{
  const tx=[]; const add=(m,day,title,category,amount,type='uitgave')=>tx.push({id:makeId(),date:makeDate(m,day),title,category,amount,type});
  for(let m=-5;m<=0;m++){
    add(m,1,'Salaris','Inkomsten',2850,'inkomsten');
    add(m,2,'Huur appartement','Wonen',920);
    add(m,5,'Albert Heijn','Boodschappen',m===0?76.23:85+(m+5)*3);
    add(m,9,'Jumbo','Boodschappen',m===0?54.81:64+(m+5)*2);
    add(m,12,'Tankstation','Vervoer',m===0?68.4:52+(m+5)*5);
    add(m,16,'Lunch buiten de deur','Uit eten',m===0?36.50:44+(m+5)*4);
    add(m,19,'Boodschappen week 3','Boodschappen',m===0?68.42:75+(m+5)*2);
    add(m,21,'Kleding en accessoires','Shoppen',m===0?84.95:95+(m+5)*9);
    add(m,23,'Drogisterij','Gezondheid',m===0?26.75:29+(m+5)*2);
    add(m,25,'Online bestelling','Overig',m===0?42.60:51+(m+5)*3);
  }
  add(0,10,'Freelance opdracht','Inkomsten',350,'inkomsten');
  add(0,18,'Restaurant','Uit eten',49.5);
  add(0,20,'Jumbo','Boodschappen',51.79);
  add(0,22,'OV-chipkaart','Vervoer',31.2);
  return {demo:true,transactions:tx,subscriptions:[
    {id:makeId(),name:'Netflix',category:'Entertainment',amount:15.99,nextDate:makeDate(0,27),status:'actief'},
    {id:makeId(),name:'Spotify',category:'Muziek',amount:10.99,nextDate:makeDate(0,29),status:'actief'},
    {id:makeId(),name:'Sportschool',category:'Sport',amount:29.95,nextDate:makeDate(1,4),status:'actief'},
    {id:makeId(),name:'Cloudopslag',category:'Software',amount:2.99,nextDate:makeDate(0,28),status:'actief'}
  ],budgets:{'Wonen':1050,'Boodschappen':350,'Vervoer':180,'Uit eten':160,'Shoppen':200,'Gezondheid':100,'Overig':140},goals:[
    {id:makeId(),name:'Noodpotje',target:5000,saved:2150,emoji:'🛟'},
    {id:makeId(),name:'Zomervakantie',target:1800,saved:720,emoji:'🏖️'},
    {id:makeId(),name:'Nieuwe laptop',target:1400,saved:350,emoji:'💻'}
  ]};
};
const emptyData=()=>({demo:false,transactions:[],subscriptions:[],budgets:Object.fromEntries(categories.map(c=>[c,0])),goals:[]});
function clean(raw){
  if(!raw||typeof raw!=='object'||!Array.isArray(raw.transactions)||!Array.isArray(raw.subscriptions)||!Array.isArray(raw.goals)||!raw.budgets||typeof raw.budgets!=='object')throw new Error('Ongeldig gegevensbestand');
  const name=s=>String(s??'').trim().slice(0,100);
  const amt=n=>Number.isFinite(Number(n))?Math.max(0,Math.min(Number(n),100000000)):0;
  const date=s=>typeof s==='string'&&/^\d{4}-\d{2}-\d{2}$/.test(s)?s:inputDate(now);
  const limited=a=>a.slice(0,5000);
  return {demo:raw.demo===true,
    transactions:limited(raw.transactions).filter(x=>x&&typeof x==='object').map(x=>({id:name(x.id)||makeId(),title:name(x.title)||'Transactie',date:date(x.date),amount:amt(x.amount),type:x.type==='inkomsten'?'inkomsten':'uitgave',category:x.type==='inkomsten'?'Inkomsten':categories.includes(x.category)?x.category:'Overig'})),
    subscriptions:limited(raw.subscriptions).filter(x=>x&&typeof x==='object').map(x=>({id:name(x.id)||makeId(),name:name(x.name)||'Abonnement',category:name(x.category)||'Overig',amount:amt(x.amount),nextDate:date(x.nextDate),status:x.status==='opgezegd'?'opgezegd':'actief'})),
    budgets:Object.fromEntries(categories.map(c=>[c,amt(raw.budgets[c])])),
    goals:limited(raw.goals).filter(x=>x&&typeof x==='object').map(x=>({id:name(x.id)||makeId(),name:name(x.name)||'Spaardoel',target:amt(x.target),saved:amt(x.saved),emoji:['🛟','🏖️','💻','🏠','🚗','🎯','💰','🎓','💍','🌍'].includes(x.emoji)?x.emoji:'🎯'}))
  };
}
let data;
try {const stored=localStorage.getItem(KEY); data=stored?clean(JSON.parse(stored)):sample();}catch(e){data=sample();}
let page=['overzicht','transacties','abonnementen','budgetten','spaardoelen','inzichten','instellingen'].includes(location.hash.slice(1))?location.hash.slice(1):'overzicht';
let filters={query:'',type:'alles',category:'alles'};
let formHandler=null,toastTimer=null;
const save=()=>{try{localStorage.setItem(KEY,JSON.stringify(data));}catch(e){notify('Opslaan is niet gelukt. Mogelijk is de opslag vol.');}};
const monthly=()=>data.transactions.filter(t=>startMonth(t.date));
const spent=category=>monthly().filter(t=>t.type==='uitgave'&&(!category||t.category===category)).reduce((a,t)=>a+t.amount,0);
const income=()=>monthly().filter(t=>t.type==='inkomsten').reduce((a,t)=>a+t.amount,0);
const activeSubs=()=>data.subscriptions.filter(s=>s.status==='actief');
const subTotal=()=>activeSubs().reduce((a,s)=>a+s.amount,0);
const pct=(a,b)=>b>0?Math.round(a/b*100):0;
function notify(message){const t=document.getElementById('toast');t.textContent=message;t.classList.add('show');clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.classList.remove('show'),3200);}
function markChanged(){data.demo=false;save();render();}
function noItems(title,msg,action,actionLabel){return `<div class="empty"><div class="empty-icon">${icon('wallet')}</div><h3>${safe(title)}</h3><p>${safe(msg)}</p>${action?`<button class="btn btn-primary" data-action="${action}">${icon('plus')} ${safe(actionLabel)}</button>`:''}</div>`;}
function section(title,subtitle,button,action){return `<div class="section-heading"><div><h2>${title}</h2><p>${subtitle}</p></div>${button?`<button class="btn btn-primary" data-action="${action}">${icon('plus')} ${button}</button>`:''}</div>`;}
const titles={overzicht:['Goed dat je er bent 👋','Hier zie je hoe jouw geld ervoor staat.'],transacties:['Jouw transacties','Al je inkomsten en uitgaven overzichtelijk op één plek.'],abonnementen:['Je abonnementen','Krijg grip op terugkerende kosten.'],budgetten:['Jouw budgetten','Geef je geld een plan, elke maand opnieuw.'],spaardoelen:['Jouw spaardoelen','Stap voor stap dichter bij wat je belangrijk vindt.'],inzichten:['Slimme bespaarinzichten','Ontdek patronen in je uitgaven.'],instellingen:['Instellingen','Beheer je gegevens en privacy.']};
function navigate(to){if(!titles[to])return;page=to;location.hash=to;filters={query:'',type:'alles',category:'alles'};closeMenu();render();window.scrollTo({top:0,behavior:'instant'});}
function closeMenu(){document.getElementById('sidebar').classList.remove('open');document.getElementById('shade').classList.remove('open');}
function render(){
  document.getElementById('page-title').textContent=titles[page][0];
  document.getElementById('page-desc').textContent=titles[page][1];
  document.getElementById('demo-pill').style.display=data.demo?'inline-flex':'none';
  document.querySelectorAll('[data-page]').forEach(b=>{b.classList.toggle('active',b.dataset.page===page); if(b.tagName==='BUTTON'){if(b.dataset.page===page)b.setAttribute('aria-current','page');else b.removeAttribute('aria-current');}});
  document.getElementById('today-label').textContent=`${monthNames[now.getMonth()]} ${now.getFullYear()}`;
  document.getElementById('copyright-year').textContent=now.getFullYear();
  el.innerHTML=({overzicht:renderOverview,transacties:renderTransactions,abonnementen:renderSubscriptions,budgetten:renderBudgets,spaardoelen:renderGoals,inzichten:renderInsights,instellingen:renderSettings})[page]();
  if(page==='transacties')fillTransactions();
}

function pie(){

 let start=0;const grad=entries.map(x=>{const end=start+x.value/sum*100;const part=`${x.color} ${start}% ${end}%`;start=end;return part;}).join(',');
 return `<div class="pie-section"><div class="donut" style="background:${sum>0?`conic-gradient(${grad})`:'#f0f1f7'}"><div class="donut-inner"><span>Totaal uitgegeven</span><strong>${money(sum)}</strong></div></div><div class="legend">${entries.length?entries.slice(0,7).map(x=>`<div class="legend-row"><span class="legend-label"><i class="color-dot" style="background:${x.color}"></i>${x.name}</span><strong>${Math.round(x.value/sum*100)}%</strong></div>`).join(''):'<p class="notice">Nog geen uitgaven deze maand.</p>'}</div></div>`;

 <div class="mini-topics"><div class="mini-topic card" style="border:0;background:#f7f8fc"><span class="eyebrow">TRANSACTIES</span><strong>${data.transactions.length}</strong><p>Opgeslagen transacties</p></div><div class="mini-topic card" style="border:0;background:#f7f8fc"><span class="eyebrow">SPAARDOELEN</span><strong>${data.goals.length}</strong><p>Aangemaakte doelen</p></div></div></section></div>${footer()}`;}
function footer(){return `<div class="fineprint">Gemaakt voor slimmer geldbeheer · Alle bedragen en inzichten zijn gebaseerd op jouw handmatig ingevoerde gegevens. Geen financieel advies.</div>`;}
function openModal(title,body,handler){formHandler=handler;const wrap=document.getElementById('modal-wrap');wrap.innerHTML=`<div class="modal"><div class="modal-heading"><h2 id="modal-title">${safe(title)}</h2><button class="icon-button" type="button" data-action="close-modal" aria-label="Sluiten">${icon('x')}</button></div><form id="edit-form">${body}<div class="form-actions"><button type="button" class="btn btn-outline" data-action="close-modal">Annuleren</button><button type="submit" class="btn btn-primary">${icon('check')} Opslaan</button></div></form></div>`;wrap.classList.add('open');wrap.setAttribute('aria-hidden','false');wrap.setAttribute('aria-labelledby','modal-title');document.body.style.overflow='hidden';setTimeout(()=>wrap.querySelector('input,select')?.focus(),0);}
function closeModal(){const wrap=document.getElementById('modal-wrap');wrap.classList.remove('open');wrap.setAttribute('aria-hidden','true');wrap.innerHTML='';document.body.style.overflow='';formHandler=null;}
function field(label,name,type,value='',extras=''){return `<label class="field"><span class="field-label">${label}</span><input class="field-control" type="${type}" name="${name}" value="${safe(value)}" ${extras} required></label>`;}
const numberField=(label,name,value)=>field(label,name,'number',value,'min="0.01" step="0.01" max="100000000"');
function selectField(label,name,options,value){return `<label class="field"><span class="field-label">${label}</span><select class="field-control" name="${name}" required>${options.map(x=>`<option ${x===value?'selected':''} value="${safe(x)}">${safe(x)}</option>`).join('')}</select></label>`;}
function transactionModal(id){const old=data.transactions.find(t=>t.id===id);openModal(old?'Transactie bewerken':'Nieuwe transactie',
 `${selectField('Type transactie','type',['uitgave','inkomsten'],old?.type||'uitgave')}${field('Omschrijving','title','text',old?.title||'','maxlength="100" placeholder="Bijv. Boodschappen"')}${numberField('Bedrag in euro','amount',old?.amount||'')}
 <div class="form-grid">${selectField('Categorie','category',old?.type==='inkomsten'?['Inkomsten',...categories]:[...categories,'Inkomsten'],old?.category||'Boodschappen')}${field('Datum','date','date',old?.date||inputDate(now))}</div>`,f=>{
   const type=f.get('type')==='inkomsten'?'inkomsten':'uitgave';const title=String(f.get('title')||'').trim();const amount=Number(f.get('amount'));const date=String(f.get('date')||'');const category=type==='inkomsten'?'Inkomsten':categories.includes(f.get('category'))?f.get('category'):'Overig';
   if(!title||!Number.isFinite(amount)||amount<=0||!validDate(date)){notify('Vul een geldige omschrijving, bedrag en datum in.');return false;}
   if(old)Object.assign(old,{type,title:title.slice(0,100),amount,date,category});else data.transactions.push({id:makeId(),type,title:title.slice(0,100),amount,date,category});markChanged();notify('Transactie opgeslagen');return true;
 });
 const form=document.getElementById('edit-form');form.querySelector('[name=type]').addEventListener('change',e=>{const cat=form.querySelector('[name=category]');if(e.target.value==='inkomsten')cat.value='Inkomsten';else if(cat.value==='Inkomsten')cat.value='Boodschappen';});}
function validDate(s){if(!/^\d{4}-\d{2}-\d{2}$/.test(s))return false;const [y,m,d]=s.split('-').map(Number);return y>=2000&&y<=2200&&m>=1&&m<=12&&d>=1&&d<=new Date(y,m,0).getDate();}
function subscriptionModal(id){const old=data.subscriptions.find(s=>s.id===id);openModal(old?'Abonnement bewerken':'Abonnement toevoegen',
 `${field('Naam abonnement','name','text',old?.name||'','maxlength="100" placeholder="Bijv. Spotify"')}${selectField('Soort','category',['Entertainment','Muziek','Sport','Software','Telefonie','Verzekering','Overig'],old?.category||'Entertainment')}${numberField('Maandbedrag in euro','amount',old?.amount||'')}${field('Volgende betaaldatum','nextDate','date',old?.nextDate||makeDate(0,Math.min(now.getDate()+3,28)))}<p class="form-hint">Ook als je per jaar betaalt, vul je hier het gemiddelde bedrag per maand in. Een statuswijziging zegt geen echt abonnement op.</p>`,f=>{
 const name=String(f.get('name')||'').trim(),amount=Number(f.get('amount')),nextDate=String(f.get('nextDate'));if(!name||!Number.isFinite(amount)||amount<=0||!validDate(nextDate)){notify('Vul alle velden correct in.');return false;}
 const obj={name:name.slice(0,100),amount,category:String(f.get('category')).slice(0,100),nextDate};if(old)Object.assign(old,obj);else data.subscriptions.push({id:makeId(),status:'actief',...obj});markChanged();notify('Abonnement opgeslagen');return true;
 });}
function budgetModal(category){const c=category||categories.find(x=>Number(data.budgets[x])===0)||'Boodschappen';openModal('Maandbudget instellen',
 `${selectField('Categorie','category',categories,c)}${field('Maximumbedrag per maand (€)','amount','number',data.budgets[c]||'','min="0" step="0.01" max="100000000"')}<p class="form-hint">Vul 0 in om een budget te verwijderen. Budgetten gelden voor iedere maand.</p>`,f=>{const a=Number(f.get('amount'));if(!Number.isFinite(a)||a<0||a>1e8){notify('Vul een geldig bedrag in.');return false;}data.budgets[f.get('category')]=a;markChanged();notify('Budget bijgewerkt');return true;});
 const form=document.getElementById('edit-form');form.querySelector('[name=category]').addEventListener('change',e=>{form.querySelector('[name=amount]').value=data.budgets[e.target.value]||'';});}
function goalModal(id){const old=data.goals.find(g=>g.id===id);openModal(old?'Spaardoel bewerken':'Nieuw spaardoel',
 `${field('Naam van je doel','name','text',old?.name||'','maxlength="100" placeholder="Bijv. Wereldreis"')}<div class="form-grid">${numberField('Doelbedrag (€)','target',old?.target||'')}${field('Al gespaard (€)','saved','number',old?.saved??0,'min="0" step="0.01" max="100000000"')}</div>${selectField('Symbool','emoji',['🎯','🛟','🏖️','💻','🏠','🚗','💰','🎓','💍','🌍'],old?.emoji||'🎯')}<p class="form-hint">Spaardoelen zijn apart bijgehouden, zonder automatische koppeling aan je transacties.</p>`,f=>{
 const name=String(f.get('name')||'').trim(),target=Number(f.get('target')),saved=Number(f.get('saved'));if(!name||!Number.isFinite(target)||target<=0||!Number.isFinite(saved)||saved<0){notify('Controleer de ingevulde bedragen.');return false;}const obj={name:name.slice(0,100),target,saved,emoji:String(f.get('emoji'))};if(old)Object.assign(old,obj);else data.goals.push({id:makeId(),...obj});markChanged();notify('Spaardoel opgeslagen');return true;
 });}
function contributionModal(id){const g=data.goals.find(g=>g.id===id);if(!g)return;openModal(`Sparen voor ${g.name}`,`${numberField('Bedrag toevoegen (€)','amount','')}<p class="form-hint">Dit bedrag verhoogt je spaardoel. Het wordt niet van je banksaldo afgeschreven.</p>`,f=>{const a=Number(f.get('amount'));if(!Number.isFinite(a)||a<=0){notify('Vul een geldig bedrag in.');return false;}g.saved+=a;markChanged();notify(`${money(a)} toegevoegd aan je spaardoel`);return true;});}
function remove(kind,id,label){if(!window.confirm(`Weet je zeker dat je deze ${label} wilt verwijderen?`))return;data[kind]=data[kind].filter(x=>x.id!==id);markChanged();notify('Item verwijderd');}
function exportData(){const blob=new Blob([JSON.stringify({...data,exportDate:new Date().toISOString()},null,2)],{type:'application/json'});const url=URL.createObjectURL(blob);const a=document.createElement('a');a.href=url;a.download=`saldo-backup-${inputDate(now)}.json`;document.body.appendChild(a);a.click();a.remove();setTimeout(()=>URL.revokeObjectURL(url),1000);notify('Back-up gedownload');}
function importData(file){if(!file)return;if(file.size>2*1024*1024){notify('Dit bestand is te groot (maximaal 2 MB).');return;}const reader=new FileReader();reader.onload=()=>{try{const imported=clean(JSON.parse(reader.result));if(!window.confirm('Alle huidige gegevens vervangen door dit back-upbestand?'))return;data=imported;save();render();notify('Gegevens succesvol geïmporteerd');}catch(e){notify('Dit is geen geldig Saldo-back-upbestand.');}};reader.onerror=()=>notify('Het bestand kon niet worden gelezen.');reader.readAsText(file);}
function handleAction(action,button){const id=button?.dataset.id;switch(action){
 case 'add-transaction':transactionModal();break; case 'edit-transaction':transactionModal(id);break; case 'delete-transaction':remove('transactions',id,'transactie');break;
 case 'add-subscription':subscriptionModal();break; case 'edit-subscription':subscriptionModal(id);break; case 'delete-subscription':remove('subscriptions',id,'abonnement');break;
 case 'toggle-subscription':{const s=data.subscriptions.find(x=>x.id===id);if(!s)return;s.status=s.status==='actief'?'opgezegd':'actief';markChanged();notify('Status aangepast in dit overzicht (geen echte opzegging)');break;}
 case 'add-budget':budgetModal();break;case 'edit-budget':budgetModal(button.dataset.category);break;
 case 'add-goal':goalModal();break;case 'edit-goal':goalModal(id);break;case 'delete-goal':remove('goals',id,'spaardoel');break;case 'contribute-goal':contributionModal(id);break;
 case 'export':exportData();break;case 'import':document.getElementById('import-file').click();break;
 case 'reset-empty':if(confirm('Alle gegevens wissen? Dit kun je niet ongedaan maken zonder back-up.')){data=emptyData();markChanged();notify('Je begint nu met een leeg overzicht');}break;
 case 'reset-demo':if(confirm('Alle huidige gegevens vervangen door voorbeeldgegevens?')){data=sample();save();render();notify('Voorbeeldgegevens hersteld');}break;
 case 'open-menu':document.getElementById('sidebar').classList.add('open');document.getElementById('shade').classList.add('open');break;
 case 'close-modal':closeModal();break;
 }}
document.addEventListener('click',e=>{const nav=e.target.closest('[data-page]');if(nav){e.preventDefault();navigate(nav.dataset.page);return;}const action=e.target.closest('[data-action]');if(action){e.preventDefault();handleAction(action.dataset.action,action);}});
document.getElementById('menu-btn').addEventListener('click',()=>handleAction('open-menu'));
document.getElementById('shade').addEventListener('click',closeMenu);
document.getElementById('modal-wrap').addEventListener('click',e=>{if(e.target===e.currentTarget)closeModal();});
document.addEventListener('keydown',e=>{if(e.key==='Escape'){closeModal();closeMenu();}});
document.addEventListener('submit',e=>{if(e.target.id!=='edit-form')return;e.preventDefault();if(!formHandler)return;const ok=formHandler(new FormData(e.target));if(ok)closeModal();});
document.addEventListener('input',e=>{if(e.target.id==='tx-search'){filters.query=e.target.value;fillTransactions();}});
document.addEventListener('change',e=>{if(e.target.id==='tx-type'){filters.type=e.target.value;fillTransactions();}else if(e.target.id==='tx-category'){filters.category=e.target.value;fillTransactions();}});
document.getElementById('import-file').addEventListener('change',e=>{importData(e.target.files?.[0]);e.target.value='';});
window.addEventListener('hashchange',()=>{const dest=location.hash.slice(1);if(titles[dest]&&dest!==page)navigate(dest);});
render();fillTransactions();
})();
</script>
</body>
</html>
